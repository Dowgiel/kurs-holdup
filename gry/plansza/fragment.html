,"Phishing, BLIK „na kolegę” i fałszywy kurier","Hasła, 2FA, passkeys i mit zmiany co 30 dni","Wycieki danych: co się dzieje z Twoim PESEL-em","Kredyt na Twoje dane: kradzież tożsamości","Fałszywe oferty pracy i mieszkań","Oszustwa uczuciowe i catfishing","Lokalizacja, metadane i cyfrowy stalking","Doxxing i swatting: kiedy adres staje się bronią","Czekoladowa afera i komentowanie cudzego ciała","Idealna twarz z filtra, looksmaxxing i „rate me”","Pornografia dorosłych: skrypty, spory i granice zgody","Intymne zdjęcia: wysłać, wyciec, zgłosić","Sekstorsja: szantaż intymnymi materiałami","Manosfera i incele: radykalizacja czy panika?","Wciąganie w grupy skrajne: Discord, Telegram, sieć 764","Hejt, cancel i „pranie” starych postów","Czaty rodziców, pracy i studiów: plotki i screeny","Szef pisze o 22:30: praca zdalna i mobbing online","Ślad cyfrowy, rekrutacja i zdjęcia z dzieciństwa","Nagrywanie spotkań, szkoleń i zajęć online","Zbiórki w sieci: rekordowy stream i co sprawdzić","Gdzie szukać pomocy: numery i kroki","AI slop: czy sieć staje się śmietnikiem?","Prawda czy AI: czy poznasz po zdjęciu?","Deepfake: jak się bronić, gdy to Ty jesteś bohaterem","Chatbot jako przyjaciel i terapeuta: pomoc czy pułapka?","AI w nauce i w pracy: pomoc, ściąganie czy plagiat?","Co wklejasz do chatbota? Dane, praca, praktyki","Dezinformacja: jak sprawdzić w pół minuty","„Ja tylko wpłaciłem”: kto odpowiada za patostream","Głos szefa, twarz znanej osoby: oszustwa z deepfake","Netykieta dziś: kropka, kciuk i kamera na spotkaniu","Wielozadaniowość to mit, a przełączanie kosztuje","Wizerunek w sieci: budować świadomie, ale uczciwie","Sławni z tego, że są sławni: influencer jako zawód","Pro-ana i „motylki”: choroba, nie styl życia","Jedno nagranie, fala protestów: głos obywateli w sieci","Dark net: czym jest, a czym nie jest","Czarne rynki dark netu: upadki, oszustwa, ślady","Dark net a krzywdzenie dzieci: rola dorosłych","Kryptowaluty: czym są, skąd kurs i co grozi","Halucynacje AI: dlaczego model zmyśla pewnym tonem","Czaty AI: kto za nimi stoi i co daje płatny plan","Ktoś ukradł Twoje zdjęcie lub projekt: co możesz zrobić","Kto jest właścicielem tego, co tworzysz w pracy","Piractwo: torrenty, pirackie IPTV i „ja tylko oglądam”","AI a prawo autorskie: trening na cudzych dziełach i wyniki","Wi-Fi, router i kamerka: co grozi w sieci i w domu","Złośliwe programy: kradzież haseł, przejęte konta i okup","Hakerzy: nastolatki, gangi, służby i ci „etyczni”"],"pola":[{"nr":1,"modul":2,"etykieta":"Scrollowanie","rodzaj":"zwykle","pyt":[["Badanie 844 dorosłych Flamandów dotyczyło pisania i dzwonienia po zgaszeniu światła. Co z niego wynika?",["Używanie telefonu w łóżku poprawia sen młodych osób","Takie używanie telefonu wiązało się z gorszym snem","Telefon po zgaszeniu światła powoduje bezsenność"],1,"Badanie jest przekrojowe, więc pokazuje związek, a nie przyczynę. Możliwe, że telefon po zgaszeniu światła biorą ludzie, którzy i tak źle śpią.",0],["Co w praktyce proponuje post na wieczór, żeby poprawić szanse na sen?",["Przeglądać feed nie dłużej niż dziesięć minut przed snem","Odłożyć telefon poza łóżko i zająć się czymś z końcem","Zostawić telefon przy łóżku i wyłączyć mu wszystkie dźwięki"],1,"Post radzi odłożyć telefon poza zasięg łóżka i zamienić ostatnie pół godziny na coś, co ma koniec, na przykład rozdział książki lub prysznic.",0],["Komentator pisze: „Włączam tryb nocny, więc mogę scrollować do późna i sen na tym nie ucierpi”. Co jest tu błędne?",["Tryb nocny działa tylko wtedy, gdy ekran jest ciemny","Kolor ekranu liczy się bardziej niż to, co oglądasz","Problemem jest też to, że nie idziesz spać, i treść"],2,"Tryb nocny zmienia barwę ekranu, ale nie treść ani to, że nie kładziesz się spać. W jednym badaniu na młodych dorosłych nie poprawił snu.",0],["Gloria Mark mierzyła pracę przy komputerze. Co oznacza jej wynik o kilkudziesięciu sekundach na jednym ekranie?",["Tyle trwa jedno oglądanie krótkiego filmu w mediach społecznościowych","Tyle średnio trwa praca na ekranie przed przełączeniem się","Tyle wynosi maksymalny czas skupienia dorosłego człowieka"],1,"To miara zachowania przy pracy, czyli czasu do przełączenia, a nie granica ludzkiej uwagi. Każde przełączenie kosztuje czas i zmęczenie.",1],["Co radzi post komuś, kto zastanawia się, czy krótkie filmy mu szkodzą?",["Całkiem zrezygnować z memów i krótkich filmów na stałe","Sprawdzić, czy po filmach trudniej wrócić do tekstu","Poczekać, aż badania ostatecznie rozstrzygną cały spór"],1,"Nie trzeba rozstrzygać sporu, by działać. Jeśli po filmach trudniej wrócić do tekstu, warto zmienić kolejność: najpierw zadanie, potem feed.",1]]},{"nr":2,"modul":2,"etykieta":"Memy","rodzaj":"zwykle","pyt":[["Komentator: „Badania udowodniły, że memy i krótkie filmy psują mózg”. Co w tym jest błędne?",["Żadne badania nie dotyczą krótkich filmów ani uwagi","Badania wykazały wyłącznie pozytywny wpływ takich treści","Są to badania pokazujące związek, a nie dowód przyczyny"],2,"Przegląd badań łączy nadmiar płytkich treści z gorszą uwagą, ale to korelacja. Możliwe, że osoby z kłopotami z uwagą chętniej po nie sięgają.",1],["Co według postu jest chronione prawem autorskim w przypadku utworu?",["Sposób wyrażenia, a nie sama idea","Tylko dzieła poważne i zawodowe","Sama idea, nawet bez żadnego zapisu"],0,"Utworem jest każdy przejaw działalności twórczej o indywidualnym charakterze, niezależnie od tego, czy jest poważny. Chroniony jest sposób wyrażenia, nie idea.",2],["Jakie trzy pytania zadać sobie przed wrzuceniem cudzego materiału do sieci?",["Czy jest ładne, czy jest popularne, czy ktoś już to wrzucił","Czy jest w sieci, czy ma podpis, czy ktoś się już czepia","Czyje to jest, czy mam zgodę, czy autor jest podany"],2,"Zasada trzech pytań porządkuje sprawę: autorstwo, zgoda lub licencja oraz podanie autora. Zdjęcia warto szukać tam, gdzie licencja jest jasna.",2],["Komentator: „Wyciąłem podpis z cudzego zdjęcia, bo psuł efekt, i nikt się nie czepia, więc jest okej”. Co jest błędne?",["Brak reakcji autora oznacza, że prawo zostało zachowane","Wycinanie podpisu jest dozwolone, gdy zdjęcie jest dobre","Wycięcie podpisu i rozpowszechnianie też narusza prawo"],2,"Autor ma prawo do podpisu przy swojej pracy, a to, że nikt się nie czepia, nie znaczy, że wolno. Autor może się odezwać nawet po miesiącach.",2],["Co według Parisera robi personalizacja wyników w sieci?",["Pokazuje nam wszystkie poglądy w równych proporcjach","Ukrywa przed nami tylko reklamy i treści płatne","Po cichu zawęża to, co widzimy, bez naszej wiedzy"],2,"Pariser nazwał ten skutek bańką filtrującą: wyniki dopasowują się do poprzednich kliknięć, więc nie wiesz, czego nie widzisz.",3]]},{"nr":3,"modul":2,"etykieta":"Algorytm uczy się Ciebie","rodzaj":"premia","doprzodu":2,"pyt":[["W badaniu Guessa i współautorów zamieniono feed algorytmiczny na chronologiczny. Co zmieniło się w trzy miesiące?",["Wyraźnie spadła polaryzacja i zmieniły się poglądy","Nic się nie zmieniło, także czas spędzany na platformie","Zmieniło się, co ludzie widzą, lecz nie ich postawy"],2,"Zmieniło się to, co użytkownicy widzą, i czas na platformie, ale polaryzacja i postawy zmieniły się nieistotnie. To nie znaczy, że algorytm nie ma wpływu.",3],["Komentator: „Skoro Bruns kwestionuje bańki, to algorytm nie ma na nas żadnego wpływu”. Co jest błędne?",["Zmieniło się, co ludzie widzą, ale nie ich postawy","Wyraźnie spadła polaryzacja i zmieniły się poglądy ludzi","Nic się nie zmieniło, także czas spędzany na platformie"],0,"Bruns uważa, że szczelne bańki nie mają mocnego poparcia w badaniach, ale zastrzega, że platformy nadal wpływają na wybór informacji i są nieprzejrzyste.",3],["Co ilustruje wynik ok. 25,4 mln jednocześnie grających w jedną grę na Robloxie w październiku 2025 roku?",["Bruns uważa, że algorytmy są całkowicie przejrzyste","Bruns twierdzi, że bańki są dobrze udowodnione","Brak szczelnej bańki nie znaczy braku wpływu"],2,"Skala pokazuje, że platforma przyciąga dorosłych, młodzież i najmłodszych, więc zasady bezpieczeństwa muszą obejmować wszystkich.",4],["Jakie zabezpieczenia konta i wydatków poleca post graczowi dorosłemu?",["Zakup konta od sprawdzonego sprzedawcy i wspólny login","Płacenie poza oficjalnym sklepem, bo bywa trochę taniej","Limit wydatków, brak zakupów od obcych i 2FA"],2,"Post radzi ustawić limit wydatków, nie kupować kont, kodów i boostingu od osób z internetu oraz włączyć uwierzytelnianie dwuskładnikowe.",4],["Komentator: „Boosting to jak korepetycje, ktoś lepszy gra za mnie”. Co w tym jest błędne?",["Wymaga podania loginu obcej osobie i łamie regulamin","Boosting nie wymaga żadnych danych, więc jest bezpieczny","Boosting jest oficjalną usługą z gwarancją sklepu gry"],0,"Boosting oznacza przekazanie komuś dostępu do konta, więc możesz stracić konto lub dane do płatności. Często łamie też regulamin gry.",4]]},{"nr":4,"modul":2,"etykieta":"Skrzynki w grach i gacha","rodzaj":"zwykle","pyt":[["Zendle i Cairns zbadali 7422 graczy. Jak wydatki na skrzynki wiązały się z problemowym hazardem?",["Słabiej niż inne zakupy, co potwierdził eksperyment w grach","Dowodem na to, że skrzynki same wywołują problemowy hazard","Silniej niż inne zakupy, bez pewności co do kierunku"],2,"Badanie wykazało silniejszy związek wydatków na skrzynki z problemowym hazardem, ale kierunku zależności nie da się wskazać.",5],["Co post radzi zrobić przed otwarciem skrzynki w grze?",["Sprawdzić szanse na nagrody i ustalić limit kwoty","Kupić jeszcze jedną, jeśli poprzednia nie dała nagrody","Poczekać na promocję i kupić od razu kilka skrzynek"],0,"Warto sprawdzić, czy gra podaje szanse na nagrody, ustalić kwotę, której nie przekroczysz, i nie kupować kolejnej po stracie.",5],["Komentator: „Po kilku nieudanych skrzynkach kolejna na pewno wypadnie lepiej”. Co jest tu błędne?",["Szansa rośnie, ale tylko przy płatności kartą w grze","Każde losowanie jest niezależne od poprzednich","Gra wyrównuje wyniki, gdy ktoś długo przegrywa z rzędu"],1,"To gonienie strat, typowy schemat hazardowy. Kolejna skrzynka po stracie nie zwiększa szansy na wygraną, bo każde losowanie jest niezależne.",5],["Czym według postu różni się FOMO od presji czasu przy zakupach?",["FOMO to technika sprzedaży, a presja czasu to lęk przed stratą","To dwa różne słowa na dokładnie to samo zjawisko","FOMO to lęk przed ominięciem, a presja to technika"],2,"FOMO to mierzalny lęk, że inni mają doświadczenie, którego Ty nie masz. Presja czasu, jak „oferta kończy się dziś”, ogranicza czas na zastanowienie.",6]]},{"nr":5,"modul":2,"etykieta":"Blind boxy","rodzaj":"pulapka","cofnij":3,"pyt":[["Co post radzi zrobić przed zakupem kolejnego blind boxa?",["Założyć, że odsprzedaż z zyskiem na pewno zwróci koszt","Czy chcę przedmiot, czy emocję losowania","Kupić od razu, bo rzadkie wersje szybko znikają ze sklepów"],1,"Przed zakupem warto ustalić miesięczny budżet na hobby i zapytać siebie, czy chcę ten konkretny przedmiot, czy emocję losowania.",6],["Komentator: „Kupuję blind boxy na odsprzedaż, to pewny zysk”. Co jest tu błędne?",["Odsprzedaż jest zawsze zakazana przez polskie prawo","Zysk bywa złudzeniem, bo dochodzą opłaty i przesyłki","Ceny rzadkich figurek zawsze rosną po zakupie pudełka"],1,"Jeśli nie liczysz kosztów, zysk bywa złudzeniem: dochodzą opłaty i przesyłki, ceny mogą spaść, a regularna odsprzedaż może mieć skutki podatkowe.",6],["Co szacuje Lancet Public Health Commission (2024) o ryzyku związanym z hazardem u dorosłych na świecie?",["Ok. 80 mln ma ryzyko, a ok. 448 mln zaburzenie","Ok. 448 mln ma ryzyko, ok. 80 mln zaburzenie","Ryzyko dotyczy niemal wszystkich dorosłych na świecie"],1,"Około 448 mln dorosłych doświadcza jakiegoś poziomu ryzyka, a ok. 80 mln z nich ma zaburzenie lub problemowy hazard, czyli podzbiór.",7],["Co radzi post osobie, która gra u bukmachera, żeby ograniczyć ryzyko?",["Podnosić stawki po przegranej, aby szybciej odrobić stratę","Ustawić limit depozytu i czasu, nie odrabiać strat","Grać na zagranicznych stronach z korzystniejszymi bonusami"],1,"Warto ustawić limity depozytu i czasu, korzystać tylko z licencjonowanych podmiotów i nie odrabiać strat, bo każdy zakład jest niezależny.",7],["Komentator: „Znam się na piłce, więc bukmacher nie ma nade mną przewagi”. Co jest błędne?",["Marża daje bukmacherowi przewagę w długim czasie","Marża bukmachera dotyczy wyłącznie początkujących graczy","Znajomość sportu gwarantuje stały zysk z zakładów"],0,"Bukmacher ma wbudowaną marżę. Serie wygranych się zdarzają, ale nie dowodzą umiejętności, a wiara w kontrolę nad wynikiem to typowy błąd poznawczy.",7]]},{"nr":6,"modul":2,"etykieta":"Patostreamy i donejty","rodzaj":"zwykle","pyt":[["Wohn i współautorzy zbadali 230 widzów płacących streamerom. Z czym wiązała się więź parasocjalna?",["Z wsparciem emocjonalnym, instrumentalnym i finansowym","Z mniejszą skłonnością do wpłat dla twórców i do oglądania","Wyłącznie z samym oglądaniem transmisji, bez płacenia"],0,"Więź parasocjalna, czyli jednostronna relacja z osobą, której się nie zna, wiązała się z trzema rodzajami wsparcia, w tym finansowym.",8],["Co post radzi, gdy ktoś proponuje wpłatę „zamawiającą” komuś upokorzenie w transmisji?",["Nie wysyłać dotacji i nie udostępniać transmisji","Wysłać małą kwotę, bo to przecież tylko wsparcie twórcy","Oglądać do końca, a zgłosić dopiero po zakończeniu transmisji"],0,"Nie wysyłaj dotacji zlecających upokorzenie lub ryzyko i nie udostępniaj takich nagrań. Gdy ktoś jest w zagrożeniu, zgłoś platformie, a w nagłym wypadku zadzwoń pod 112.",8],["Komentator: „Skoro osoba się zgodziła, nie ma problemu”. Co w tym jest błędne?",["Przepis o patostreamingu obejmuje poniżanie także za zgodą","Przepis obejmuje wyłącznie sytuacje bez zgody osoby","Zgoda zawsze całkowicie zwalnia nadawcę z odpowiedzialności"],0,"Od 23 sierpnia 2026 r. przepis karny dotyczy rozpowszechniania poniżającego traktowania człowieka także za jego zgodą. Donaty dodatkowo zachęcają do eskalacji.",8],["Co sprawia, że w wyzwaniach w sieci trudno odmówić?",["Anonimowy udział bez nominowania innych","Obowiązkowa opłata za udział w grupie","Nominacja i publiczny dowód wykonania"],2,"Nominacja jest osobistym zaproszeniem, a odmowa jest widoczna dla całej grupy.",9],["Znajomy nominował Cię do wyzwania w sieci. Co warto zrobić, zanim się zgodzisz?",["Sprawdzić, ilu znajomych już wzięło udział w wyzwaniu","Zapytać o najgorszy scenariusz i o zysk","Nagrać próbę, by mieć dowód, że jest bezpiecznie"],1,"Warto zadać pytania o najgorszy scenariusz, zysk osób trzecich i możliwość odmowy bez wyjaśnień.",9]]},{"nr":7,"modul":3,"etykieta":"Wyzwania w sieci","rodzaj":"zwykle","pyt":[["Komentator: „Wszyscy to robią, więc jest bezpiecznie”. Co jest w tym błędne?",["Liczy się wyłącznie to, czy wyzwanie jest charytatywne","Wiele osób obniża ryzyko, ale tylko przy wyzwaniach","To dowód społeczny, a nie argument o bezpieczeństwie"],2,"Ryzyko nie maleje dlatego, że uczestniczy dużo osób. W eksperymentach pod presją grupy ludzie powtarzali błędną odpowiedź, choć znali właściwą.",9],["Dlaczego finfluencerzy często działają w luce regulacyjnej?",["Nie są licencjonowanymi doradcami","Ich porady nie podlegają żadnej kontroli w Europie","Prawo uznaje ich wyłącznie za dziennikarzy"],0,"Porady finfluencerów przypominają doradztwo, ale nie zawsze podlegają tym samym zasadom co doradztwo licencjonowane.",10],["Przed wpłatą za kurs „na zarobek” warto o coś poprosić sprzedawcę. O co?",["O rozliczenie przychodów i kosztów","O zaliczkę, aby zablokować niższą cenę kursu","O dodatkowe opinie klientów z jego własnego kanału"],0,"Zrzut ekranu można dobrać i zmodyfikować, a rozliczenie przychodów i kosztów pozwala ocenić realny zysk.",10],["Komentator: „Znam osobę, która kupiła kurs i zarobiła, więc to działa”. Co jest błędne?",["Zarobek znajomego dowodzi, że kurs jest uczciwy","To błąd ocalałego: nie widać tych, którzy stracili","Pojedyncza historia sukcesu jest zawsze zmyślona"],1,"Osoby, które kupiły kurs i nie zarobiły, zwykle nie nagrywają filmów, więc widać tylko zwycięzców. Poza tym przychód to nie zysk.",10],["Co zwykle dzieje się po małej wpłacie na fałszywą platformę inwestycyjną?",["Platforma wypłaca cały zysk po upływie miesiąca bez opłat","Pieniądze trafiają na giełdę pod nadzorem KNF","Panel pokazuje zysk, potem pada prośba o opłatę"],2,"Wykres na ekranie to rysunek strony, a nie rynek. Zysk jest pozorny, a opłaty za wypłatę służą kolejnym wyłudzeniom.",11]]},{"nr":8,"modul":3,"etykieta":"Krypto","rodzaj":"zwykle","pyt":[["Reklama z celebrytą obiecuje zysk z krypto. Jak ją potraktować?",["Jako wiarygodną, jeśli wpłata jest niewielka","Jako dowód, że oferta została sprawdzona","Jako sygnał oszustwa, a nie polecenie"],2,"Wizerunek znanych osób bywa podrabiany deepfakem, a poleganie na autorytecie to częsty element oszustwa.",11],["Komentator: „Krypto to czysty hazard, bo nie generuje przepływów pieniężnych”. Co jest uproszczone?",["Krypto jest inwestycją, jeśli kupujesz tylko bitcoina","Spór został rozstrzygnięty na korzyść krytyków","Granica zależy od sposobu użycia i jest płynna"],2,"To jedna ze stron sporu. Stała, niewielka kwota odkładana na lata różni się od lewarowanego handlu na emocjach.",11],["Czym zajmuje się tzw. słup finansowy?",["Sprzedaje oszustom dane z publicznych wycieków baz","Użycza konta lub BLIK-a albo wypłaca pieniądze","Kieruje grupą i planuje kolejne wyłudzenia online"],1,"Słup nie jest szefem grupy, ale bez niego pieniądze z oszustwa trudno wyprać.",12],["Dostajesz ofertę: użycz konta lub BLIK-a, a dostaniesz procent. Co robić?",["Zgodzić się, jeśli prowizja jest odpowiednio wysoka","Odmówić i nie udostępniać konta ani BLIK-a","Zażądać umowy i dopiero wtedy użyczyć konta"],1,"Konta, karty, BLIK-a ani numeru telefonu nie udostępnia się nikomu, nawet za prowizję.",12],["Ktoś mówi: „Nie wiedziałem, skąd pieniądze, więc nie odpowiadam”. Co jest błędne?",["Niewiedza nie zawsze chroni przy podejrzanej ofercie","Odpowiada tylko osoba, która wyłudziła pieniądze od ofiar","Odpowiedzialność zależy od kwoty, nie od wiedzy"],0,"Gdy oferta wyglądała podejrzanie, sąd może uznać, że ktoś godził się na ryzyko. Liczy się udział i wiedza o pochodzeniu środków.",12]]},{"nr":9,"modul":3,"etykieta":"Phishing","rodzaj":"premia","doprzodu":2,"pyt":[["Co należy zrobić z kodem BLIK, hasłem i kodem SMS?",["Zachować je wyłącznie dla siebie","Przekazać je znajomemu w razie pilnej prośby","Podawać je tylko osobie, która dzwoni z banku"],0,"Kod BLIK, hasło i kod SMS są tylko dla Ciebie, bo kod BLIK pozwala wypłacić pieniądze lub zapłacić.",13],["Znajomy z komunikatora prosi o pilny przelew BLIK. Jak zweryfikować prośbę?",["Zadzwonić do niego na znany numer","Dopytać o szczegóły w tej samej rozmowie","Sprawdzić zdjęcie profilowe i nazwę konta"],0,"Oszust przejmuje konto w komunikatorze i prosi znajomych o pożyczkę, więc prośbę o pieniądze potwierdza się telefonem.",13],["Komentator: „Mnie nie oszukają, jestem informatykiem”. Co jest błędne?",["Podatność zależy od chwili, np. od pośpiechu","Informatycy są podatni tylko na ataki telefoniczne i SMS","Wiedza techniczna chroni, ale tylko w pracy zawodowej"],0,"Zmęczony lub spieszący się człowiek, także informatyk, może kliknąć. Podatność zależy od kontekstu, nie od inteligencji.",13],["Co mówią wytyczne NIST o wymuszaniu okresowej zmiany haseł bez powodu?",["Zalecają zmianę co 30 dni dla ważnych kont","Zalecają zmianę raz na kwartał razem z 2FA","Odradzają ją, a wersja z 2025 roku jej zabrania"],2,"NIST odradza taką praktykę od 2017 roku, a wersja końcowa z 2025 roku wprost jej zabrania.",14],["W jakiej sytuacji według kursu warto zmienić hasło?",["Po wycieku lub przy podejrzeniu","Za każdym razem, gdy zmieniasz telefon lub system","Co miesiąc, według stałego kalendarza w firmie"],0,"Wymuszone, częste zmiany prowadzą do przewidywalnych wzorów, więc hasło zmienia się po wycieku lub podejrzeniu.",14]]},{"nr":10,"modul":3,"etykieta":"Hasła","rodzaj":"zwykle","pyt":[["Komentator: „Hasło Ania1985! jest bezpieczne, bo ma cyfry i wykrzyknik”. Co jest błędne?",["Brakuje w nim znaku specjalnego innego niż wykrzyknik","To typowy wzór, który sprawdzają jako pierwszy","Jest zbyt długie i przez to trudne do zapamiętania"],1,"Imię, rok i wykrzyknik to wzór sprawdzany na początku. Formalna złożoność nie zastępuje losowości i unikalności.",14],["Jak doszło do wycieku z systemu egzaminów zawodowych CKE w 2025 roku?",["Pracownik wysłał całą bazę w odpowiedzi na phishing","Włamywacz przełamał zabezpieczenia systemu egzaminów","Użyto konta pracownika z hasłem używanym prywatnie"],2,"Systemu nie przełamano. Ktoś użył konta pracownika szkoły, który tego samego hasła używał prywatnie.",15],["Co warto zrobić, jeśli Twój PESEL nie jest zastrzeżony?",["Zastrzec go za darmo w mObywatelu","Zmienić go w urzędzie gminy po wycieku","Zapłacić bankowi za dodatkową ochronę numeru"],0,"Wyciek nie jest powodem zmiany PESEL, dlatego zastrzeżenie w mObywatelu jest podstawową ochroną.",15],["Komentator: „Po wycieku nic nie zrobisz, dane już krążą”. Co jest błędne?",["Zastrzeżony PESEL i 2FA blokują typowe nadużycia","Wystarczy odczekać rok, aż dane stracą ważność","Dane można wycofać z obiegu, zgłaszając wniosek firmie"],0,"Zabezpieczenia nie cofną wycieku, ale ograniczają to, co ktoś z danymi zrobi.",15]]},{"nr":11,"modul":3,"etykieta":"Kredyt na Twoje dane","rodzaj":"pulapka","cofnij":3,"pyt":[["Co od 1 czerwca 2024 muszą robić banki i inne instytucje w sprawie PESEL?",["Sprawdzać, czy PESEL jest zastrzeżony","Informować klienta o każdym użyciu PESEL","Zastrzegać PESEL każdemu klientowi z urzędu"],0,"Obowiązek sprawdzania zastrzeżenia dotyczy m.in. banków, firm pożyczkowych, operatorów i notariuszy.",16],["Dostajesz nakaz zapłaty z e-sądu za kredyt, którego nie brałeś. Co robić?",["Odpisać dopiero po miesiącu, bez dokumentów sprawy","Poczekać, aż bank sam wycofa nakaz zapłaty","Złożyć sprzeciw w ciągu 14 dni od doręczenia"],2,"Po upływie 14 dni nakaz się uprawomocni, więc na sprzeciw masz tylko tyle czasu od doręczenia.",16],["Komentator: „Mam zastrzeżony PESEL, więc skan dowodu jest bezpieczny”. Co jest błędne?",["Zastrzeżenie działa dopiero po 30 dniach od założenia","To tylko jedna warstwa ochrony, nie pancerz","Zastrzeżenie chroni też sam skan dowodu przed użyciem"],1,"Zastrzeżenie dotyczy PESEL, więc nie chroni automatycznie przed użyciem skanu tam, gdzie nikt go nie sprawdza.",16],["Ogłoszenie mieszkania poniżej cen rynkowych i prośba o kaucję przed oglądaniem. Co to oznacza?",["Normalną praktykę przy dużym zainteresowaniu","Klasyczny sygnał ostrzegawczy","Dowód, że właściciel jest wiarygodny"],1,"Płatność z góry, bez umowy i bez spotkania, wystarcza, by przerwać rozmowę.",17],["„Pracodawca” prosi, byś przyjął przelewy i przekazał je dalej. Jak to ocenić?",["To legalne, jeśli podpiszesz umowę o pracę","To nie praca, tylko rola słupa","To zwykła praca pośrednika płatności online"],1,"Pieniądze mogą pochodzić z oszustw, a Ty możesz mieć problemy z bankiem i policją.",17]]},{"nr":12,"modul":4,"etykieta":"Fałszywe oferty pracy","rodzaj":"zwykle","pyt":[["Komentator: „Dał się nabrać na ofertę, bo był naiwny”. Co jest błędne?",["Ofiary nie sprawdziły ogłoszenia w rejestrach","Nabierają się głównie osoby bez doświadczenia","Oszuści wykorzystują pośpiech i brak alternatyw"],2,"Osoby szukające szybko pokoju lub pracy mają mniej czasu i opcji. Obwinianie ofiar zniechęca do zgłaszania.",17],["Analiza zgłoszeń do australijskiego Scamwatch (Cross i Layt 2022) podważa mit naiwności ofiar. Co robiło wielu poszkodowanych?",["Ufali profilowi, bo wcześniej sprawdzili go w rejestrze","Rozpoznawali oszustwo, ale płacili ze współczucia","Mieli wątpliwości i próbowali je sprawdzać, np. zdjęcia"],2,"Wielu poszkodowanych podejrzewało skradzione zdjęcia i szukało ich w wyszukiwarce, więc nie byli po prostu naiwni.",18],["Osoba poznana w sieci, której nigdy nie spotkałeś na żywo, prosi Cię o kartę prezentową. Co jest właściwą reakcją?",["Nie wysyłać pieniędzy, kart prezentowych ani kryptowalut","Poprosić o zdjęcie dokumentu i dopiero wtedy wysłać kartę","Wysłać symboliczną kwotę, aby sprawdzić jej reakcję"],0,"Nie wysyła się pieniędzy, kart prezentowych ani kryptowalut osobie, której nie spotkano na żywo.",18],["Komentator twierdzi, że oszustwa uczuciowe dotykają tylko naiwnych i samotnych. Co jest w tym uproszczeniem?",["Oszuści wybierają wyłącznie osoby z dużymi oszczędnościami","Wielu poszkodowanych to osoby ostrożne i wykształcone","Samotność w ogóle nie zwiększa ryzyka oszustwa"],1,"Oszustwo działa dzięki procesowi emocjonalnemu, a nie brakowi inteligencji. Samotność zwiększa ryzyko, ale nie jest warunkiem.",18],["Co ujawniła zbiorcza mapa tras biegaczy, którą firma Strava opublikowała pod koniec 2017 roku?",["Prywatne wiadomości biegaczy opublikowane przez pomyłkę","Pozycje użytkowników zdobyte po włamaniu na ich konta","Kształt baz wojskowych, bo żołnierze biegali wokół nich"],2,"Nikt nie włamał się do systemu: wystarczyło zebrać trasy, które użytkownicy sami opublikowali.",19]]},{"nr":13,"modul":4,"etykieta":"Lokalizacja","rodzaj":"zwykle","pyt":[["Biegasz z aplikacją sportową i nie chcesz, by ktoś ustalił, gdzie mieszkasz. Jakie ustawienia warto zmienić?",["Profil prywatny i strefa ukryta wokół domu","Opis profilu bez adresu, trasy widoczne dla wszystkich","Pseudonim zamiast nazwiska przy publicznych trasach"],0,"Prywatność profilu i ukryta strefa wokół domu ograniczają to, co można złożyć w obraz Twojej rutyny.",19],["Ktoś pisze: „Kto nie ma nic do ukrycia, nie musi się bać udostępniania lokalizacji”. Co jest w tym błędne?",["Zgoda raz udzielona obowiązuje już na stałe","Udostępnianie lokalizacji jest bezpieczne w płatnych aplikacjach","Liczy się, czy można odmówić lub wyłączyć bez kary"],2,"Zgoda ma sens, gdy jest dobrowolna, wzajemna i odwoływalna bez kary. Awantura po wyłączeniu lokalizacji to kontrola, nie troska.",19],["Czym jest swatting?",["Fałszywym alarmem wysyłającym służby pod cudzy adres","Włamaniem na cudze konto w celu opublikowania jego danych","Publikacją czyjegoś adresu w komentarzach pod sporną kłótnią"],0,"Swatting to fałszywe zgłoszenie na numer alarmowy, by wysłać uzbrojoną interwencję pod cudzy adres.",20],["Twój adres i miejsce pracy zostały opublikowane w sieci. Co warto zrobić na początku, poza zgłoszeniem sprawy?",["Zrobić zrzuty ekranu z adresem strony i nazwą konta","Odpowiedzieć autorowi wpisu i ujawnić jego dane osobowe","Skasować własne konta w sieci i czekać, aż wpis zniknie"],0,"Zrzuty ekranu z adresem strony, datą i nazwą konta są dowodem przy zgłoszeniu platformie i policji.",20],["Komentator: „Kto zachowuje się paskudnie w sieci, ten sam sobie winien, jeśli ktoś ujawni jego adres”. Co jest błędne?",["Nikt nie kontroluje, kto dalej użyje ujawnionych danych","Adres można ujawnić, jeśli wcześniej zrobiono zrzuty ekranu","Polskie prawo wprost zezwala na to wobec autorów hejtu"],0,"Ujawnienie adresu to ryzyko dla osoby, jej bliskich i sąsiadów, a błędne wskazanie osoby krzywdzi niewinnych.",20]]},{"nr":14,"modul":4,"etykieta":"Czekoladowa afera","rodzaj":"zwykle","pyt":[["Jak według materiału ocenia się komentarz o czyimś jedzeniu, który jest opakowany w troskę?",["Po intencji osoby, która komentarz wygłasza","Po tym, czy komentarz jest zgodny z zaleceniami lekarza","Po skutku: gdy ktoś musi się tłumaczyć z każdego kęsa"],2,"Jeśli ktoś ma się tłumaczyć z każdego kęsa, to nie jest wsparcie, tylko nadzór. Prosty test: czy ta osoba o to prosiła.",21],["Martwisz się tym, co je bliska osoba. Co powinieneś zrobić zamiast komentować jej talerz?",["Zacząć od słów „tylko mówię, bo się martwię”","Powiedzieć o swoich obawach, ale tylko w gronie rodziny","Zapytać, czy chce rozmawiać, i przyjąć odpowiedź „nie”"],2,"Troskę okazuje się pytaniem otwartym i akceptacją odmowy, a nie komentarzem do talerza.",21],["Komentator: „Skoro ktoś jest influencerem, to musi znosić komentarze o swoim ciele”. Co jest w tym błędne?",["Komentować wolno, jeśli pisze tak duża liczba widzów naraz","Krytykować wolno wszystkich, którzy sami pokazują swoje ciało","Bycie widocznym nie daje prawa do oceniania ciała ani hejtu"],2,"Bycie widocznym w sieci nie daje innym prawa do oceniania cudzego ciała ani do hejtu, także wobec osoby, którą krytykują wszyscy.",21],["Rajanala i in. (2018) wiążą filtry z prośbami o operacje „do selfie”. Jakiego rodzaju jest to tekst?",["Metaanaliza kilkudziesięciu badań klinicznych z gabinetów","Opinia oparta na obserwacjach z gabinetów, nie badanie","Eksperyment z grupą kontrolną wśród pacjentów kliniki"],1,"To tekst typu opinia, więc nie dowodzi skali zjawiska, choć wskazuje na nierealny wzorzec twarzy.",22],["Myśli o wyglądzie zabierają Ci godziny dziennie i powodują unikanie ludzi. Co zalecono w takiej sytuacji?",["Skorzystanie z zabiegu, który poprawi wygląd","Zapytanie anonimowych osób o ocenę w stylu „rate me”","Rozmowę z psychologiem lub lekarzem"],2,"Takie objawy są sygnałem do rozmowy ze specjalistą. Zabieg nie musi usunąć przyczyny cierpienia.",22]]},{"nr":15,"modul":4,"etykieta":"Idealna twarz z filtra","rodzaj":"premia","doprzodu":2,"pyt":[["Komentator: „Dysmorfia ma złożone przyczyny, więc filtry są neutralne”. Co jest w tym błędne?",["Dysmorfia powstaje wyłącznie przez filtry, innych przyczyn brak","Filtr zmienia standard, do którego porównujemy własną twarz","Badania dowiodły, że filtry nie mają żadnego wpływu"],1,"Filtr tworzy twarz, której nikt nie ma. Brakuje jednak mocnych badań, więc nie wolno ani obwiniać filtrów, ani ich bagatelizować.",22],["Dwie meta-analizy dotyczące pornografii i agresji dały różne wyniki. Co można powiedzieć o ich przyczynowości?",["To korelacje, więc nie rozstrzygają o przyczynie","Obie potwierdzają, że oglądanie wywołuje agresję fizyczną","Pierwsza dowodzi przyczynowości, a druga ją całkowicie obala"],0,"Wyniki to korelacje, więc nie wiadomo, czy pornografia wpływa na ludzi, czy ludzie o pewnych skłonnościach po nią sięgają.",23],["Co według Grubbsa i in. (2019) często silniej wiąże się z poczuciem „uzależnienia” od pornografii niż czas oglądania?",["Wiek, w którym zaczęto oglądać","Rodzaj urządzenia, na którym ogląda się treści","Konflikt z własnymi przekonaniami moralnymi"],2,"Poczucie uzależnienia często wynika z niezgodności z własnymi wartościami, a nie z samej liczby godzin.",23],["Komentator: „Skoro film jest w dużym serwisie, to wszyscy w nim występują dobrowolnie”. Co jest błędne?",["Zgoda i weryfikacja bywały zaniedbane, więc źródło się liczy","Serwisy nie mają technicznej możliwości sprawdzenia zgody osób","Dobrowolność ocenia się po liczbie wyświetleń i opinii o filmie"],0,"Sprawy z San Diego i wycofanie milionów filmów po reportażu pokazują, że „legalne” nie zawsze znaczy „dobrowolne”.",23],["Jak działa narzędzie StopNCII.org dla osób dorosłych, których intymne zdjęcie wyciekło?",["Telefon tworzy cyfrowy odcisk, a zdjęcie z niego nie wychodzi","Zdjęcie trafia do serwisu, który usuwa je z całego internetu","Pracownicy serwisu oglądają zdjęcie i zgłaszają je platformom"],0,"Sam obraz nie opuszcza telefonu, a platformy partnerskie blokują pasujące pliki. Nie usuwa to zdjęcia z całego internetu.",24]]},{"nr":16,"modul":4,"etykieta":"Intymne zdjęcia","rodzaj":"zwykle","pyt":[["Twoje intymne zdjęcie wyciekło do sieci. Co warto zrobić, zanim zaczniesz zgłaszać treść platformom?",["Skasować rozmowę i konto, aby wyciek się nie rozprzestrzeniał","Napisać do osoby rozsyłającej i zażądać usunięcia zdjęcia","Zrobić zrzuty ekranu z adresami stron i nazwami kont"],2,"Zrzuty ekranu z adresami stron, nazwami kont i datami zabezpieczają dowody, zanim cokolwiek zostanie skasowane.",24],["Komentator: „Skoro sama wysłała zdjęcie, nie ma pretensji, że ktoś je rozesłał”. Co jest błędne?",["Wysłanie zdjęcia nie jest zgodą na rozsyłanie","Odpowiedzialność ponosi osoba, która wykonała to zdjęcie sama","Zdjęcie wysłane jednej osobie staje się wspólne dla grupy"],0,"Winny jest ten, kto rozsyła zdjęcie bez zgody. Obwinianie ofiary sprawia, że ofiary milczą.",24],["Co pokazało badanie Eaton i in. (2022) w USA o osobach zgłaszających sekstorsję od początku pandemii?",["Zgłaszali ją i mężczyźni (4,5%), i kobiety (2,3%)","Zgłaszały ją tylko osoby poniżej 20. roku życia","Zgłaszały ją prawie wyłącznie kobiety, mężczyźni sporadycznie"],0,"Ofiarami są także dorośli mężczyźni. To dane samoopisowe z jednej populacji, więc nie przenosi się ich wprost na Polskę.",25],["Ktoś szantażuje Cię intymnym nagraniem i żąda przelewu. Co robić według materiału?",["Zablokować kontakt i od razu skasować całą rozmowę","Nie płacić, zrobić zrzuty ekranu i zgłosić policji","Zapłacić tylko raz, aby sprawca usunął całe nagranie"],1,"Płatność nie kończy szantażu, a skasowanie rozmowy niszczy dowody.",25],["Komentator: „Szantażysta pewnie blefuje, więc wystarczy go zablokować”. Co jest w tym błędne?",["Blokuje się po zabezpieczeniu dowodów i zgłoszeniu","Blokować wolno tylko wtedy, gdy sprawca jest w kraju","Blokada kończy szantaż i zabezpiecza przed rozesłaniem"],0,"Nie da się sprawdzić, czy to blef. Blokada jest dobrym krokiem po zabezpieczeniu dowodów, a zgłoszenie pomaga też innym ofiarom.",25]]},{"nr":17,"modul":4,"etykieta":"Manosfera i incele","rodzaj":"pulapka","cofnij":3,"pyt":[["Co pokazała analiza 28,8 mln postów (Ribeiro i in. 2021) o aktywności w manosferze w czasie?",["Każdy użytkownik z czasem staje się coraz agresywniejszy","Aktywność przesuwa się od inceli ku coachom podrywu","Aktywność przesuwa się ku toksyczniejszym grupom"],2,"To trend ogólny: nie znaczy, że każdy użytkownik się zmienia, tylko że aktywność idzie w stronę toksyczniejszych grup.",26],["Znajomy zaczyna się wciągać w manosferę. Od czego według materiału zacząć rozmowę?",["Przedstawić statystyki przemocy inceli i zażądać odejścia z forów","Zerwać kontakt, dopóki nie zmieni swoich poglądów całkowicie","Zapytać, co go w tym przyciąga, i zaproponować alternatywę"],2,"Wyśmiewanie zamyka rozmowę. Pomaga pytanie i konkretna alternatywa, a przy groźbach przemocy zgłoszenie służbom.",26],["Komentator: „Manosfera to czysty biznes, a słuchacze to wyłącznie ofiary naciągaczy”. Co jest błędne?",["Słuchacze są zawsze w pełni świadomymi współsprawcami","Motywy bywają mieszane, część wierzy w to, co mówi","Nikt w manosferze nie zarabia, to wyłącznie dla zabawy hobby"],1,"Redukcja do biznesu utrudnia zrozumienie, dlaczego przekaz trafia do ludzi.",26],["Które z zachowań na serwerze jest czerwoną flagą wciągania w grupę skrajną?",["Pytanie o ulubione hobby podczas rozmowy w grupie","Zaproszenie do wspólnej gry na ogólnym kanale serwera","Prośba o przejście na prywatny kanał z tajemnicą"],2,"Czerwone flagi to m.in. prośba o prywatny kanał, tajemnica, rangi za posłuszeństwo i groźba wykluczenia lub ujawnienia.",27]]},{"nr":18,"modul":5,"etykieta":"Wciąganie w grupy skrajne","rodzaj":"zwykle","pyt":[["Ktoś na serwerze namawia Cię do krzywdy siebie lub innych. Co według materiału zrobić?",["Skasować konto, żeby usunąć ślady rozmowy z serwera","Przerwać kontakt, zrobić zrzuty i zgłosić serwer","Odpisać i spróbować przekonać namawiającego do zmiany"],1,"Należy przerwać kontakt, zrobić zrzuty ekranu, nie kasować konta i zgłosić serwer w aplikacji oraz na Dyżurnet.pl.",27],["Komentator pisze, że osoby wciągnięte w taką grupę same są sobie winne. Co jest w tym błędne?",["Wina rozkłada się po równo na obie strony","Wina zależy od wieku osoby wciągniętej","Wina leży po stronie osoby, która wciąga"],2,"Wina leży po stronie wciągającego, a kryzys może dotknąć każdego, także dorosłego i wykształconego. Obwinianie utrudnia proszenie o pomoc.",27],["Czym według materiału różni się krytyka od hejtu?",["Krytyka dotyczy osoby, a hejt konkretnego czynu","Krytyka dotyczy czynu, hejt dotyczy człowieka","Różnią się tylko liczbą użytych wulgaryzmów"],1,"Krytyka odnosi się do czynu, który da się sprawdzić, a hejt atakuje człowieka i rośnie z liczbą uczestników.",28],["Dostajesz falę nieprzyjemnych komentarzy pod swoim wpisem. Co według materiału warto zrobić?",["Odpisać od razu każdemu, żeby wyjaśnić swoje racje","Zrobić zrzuty z datą i nazwą konta oraz zgłosić","Skasować konto, żeby zrzuty ekranu przestały krążyć"],1,"Warto robić zrzuty z datą i nazwą konta, nie odpisywać w złości i zgłaszać w serwisie. Skasowanie konta nie usuwa screenów, które już krążą.",28],["Komentator twierdzi, że zalew wyzwisk od setek obcych osób to zwykła konsekwencja wpisu. Co jest błędne?",["Kara nie musi być proporcjonalna, jeśli wpis był publiczny","To dodatkowa szkoda, a wyzwiska mogą być przestępstwem","Wyzwiska są dozwolone, jeśli wpis był kontrowersyjny"],1,"Ktoś odpowiada za treść wpisu, ale kara musi być proporcjonalna. Zalew wyzwisk to dodatkowa szkoda, a same wyzwiska mogą być przestępstwem.",28]]},{"nr":19,"modul":5,"etykieta":"Czaty rodziców","rodzaj":"pulapka","cofnij":3,"pyt":[["Co według materiału trzeba wiedzieć o screenie cudzej rozmowy z czatu?",["To pełny dowód prawdy, bo pokazuje, kto co napisał","To zapis, którego nie da się wysłać dalej bez zgody","To tylko wycinek rozmowy, a nie dowód prawdy"],2,"Screen to wycinek, a nie dowód prawdy. Można go wysłać dalej bez zgody autora, a jego przekazywanie bywa naruszeniem dóbr osobistych.",29],["Zanim wrzucisz na czat screen cudzej rozmowy, co powinieneś zrobić?",["Zapytać, czy ta osoba się na to zgodzi","Zasłonić nazwiska i od razu wrzucić go do grupy","Poczekać dobę, aż emocje opadną, i wtedy wrzucić"],0,"Najpierw warto zapytać, czy osoba z rozmowy się zgodzi, bo screen można wysłać dalej bez jej wiedzy.",29],["Komentator mówi, że wykluczenie z czatu online nie boli, bo to nie życie na żywo. Co mówi materiał?",["Boli wyłącznie wtedy, gdy trwa dłużej niż rok","Boli tylko wtedy, gdy wykluczenie dotyczy czatu zawodowego","Badania laboratoryjne pokazują, że online też boli"],2,"Badania laboratoryjne pokazują, że wykluczenie online też boli, choć nie wiemy dokładnie, jak mocno przekłada się to na życie codzienne.",29],["Czy w Polsce istnieje ogólne, wprost nazwane „prawo do odłączenia”?",["Nie, ochronę dają głównie przepisy o czasie pracy","Tak, ale obejmuje wyłącznie osoby pracujące na zleceniu","Tak, wynika ono wprost z przepisów Kodeksu pracy"],0,"Takiego ogólnego prawa nie ma. Ochronę dają przepisy o czasie pracy i odpoczynku, ale dotyczą głównie umów o pracę.",30],["Podejrzewasz mobbing online ze strony przełożonego. Co według materiału warto zapisywać?",["Wyłącznie ostatnią wiadomość, która Cię zdenerwowała","Daty, godziny i treść wiadomości, także zrzuty","Tylko własne odczucia i ocenę nastroju przełożonego"],1,"Warto zapisywać daty, godziny i treść wiadomości, bo ciężar udowodnienia spoczywa zwykle na osobie poszkodowanej.",30]]},{"nr":20,"modul":5,"etykieta":"Praca zdalna i mobbing","rodzaj":"zwykle","pyt":[["Komentator radzi opublikować w sieci prywatne dane szefa i jego wiadomości. Co jest w tym ryzykowne?",["Grozi utratą prawa do bezpłatnej porady w PIP","Grozi zawieszeniem konta, ale nie sprawą w sądzie","Grozi zniesławieniem lub pozwem o dobra osobiste"],2,"Publiczne wywlekanie spraw i prywatnych danych to prosta droga do zniesławienia lub pozwu. Skuteczniejsza jest dokumentacja i droga formalna.",30],["Eksperyment na ponad 4 tys. amerykańskich pracodawców porównał kandydatów różnych wyznań. Co wykazał?",["Ogółem brak różnicy, lokalnie dyskryminacja","Częstsze oddzwanianie do kandydata muzułmańskiego","Dyskryminację we wszystkich regionach w równym stopniu"],0,"Ogólnie nie było różnicy w oddzwonieniach, ale w części, bardziej konserwatywnych regionów dyskryminacja się pojawiła (Acquisti i Fong 2020).",31],["Jak według materiału sprawdzić, co o Tobie jest w sieci?",["Wpisać imię i nazwisko w wyszukiwarkę, też w grafikę","Zapłacić firmie, która obieca usunąć wszystko na zawsze","Podać swój PESEL w serwisie, który przeszuka sieć za Ciebie"],0,"Sprawdzasz sam, wpisując dane w wyszukiwarkę. Prośby o PESEL lub o login i hasło to sposoby na wyłudzenie danych.",31],["Komentator mówi: skoro profil jest publiczny, rekruter może go użyć do czegokolwiek. Od czego zależy, czy to w porządku?",["Publiczne treści chronione są tak samo jak prywatne wiadomości","Rekruter może oglądać zdjęcia, ale nie czytać żadnych wpisów","Zgodność z normami kontekstu, a nie samo „publiczne”"],2,"Według Nissenbaum liczy się, czy informacja płynie zgodnie z normami kontekstu. „Publiczne” nie znaczy „do dowolnego użytku”.",31],["Co jest zwykle bezpieczniejsze przy dzieleniu się materiałami z zajęć?",["Publikacja całego wykładu na kanale w sieci","Rozsyłanie zdjęć wszystkich slajdów całej grupie","Dzielenie się notatkami własnymi słowami"],2,"Notatki własnymi słowami są zwykle bezpieczniejsze niż kopiowanie slajdów lub wykładów, ale zasady mogą zależeć od organizatora i regulaminu.",32]]},{"nr":21,"modul":5,"etykieta":"Nagrywanie spotkań","rodzaj":"premia","doprzodu":2,"pyt":[["Chcesz nagrać szkolenie lub wykład online. Co powinieneś zrobić najpierw?",["Zapytać prowadzącego o zgodę i sprawdzić regulamin","Włączyć nagrywanie po cichu, bo to tylko dla siebie","Uprzedzić uczestników dopiero po zakończeniu zajęć"],0,"Najpierw pytasz prowadzącego o zgodę i sprawdzasz regulamin organizatora, czyli firmy, szkoły lub uczelni.",32],["Komentator mówi: płacę za studia, więc mogę nagrywać wykłady i rozsyłać je grupie. Co jest błędne?",["Opłata wystarcza, o ile nagranie nie zawiera obrazu","Opłata nie daje praw do materiałów wykładowcy","Opłata daje prawo do nagrań, lecz nie do ich edycji"],1,"Opłata za studia nie oznacza praw do materiałów wykładowcy ani zgody na rozpowszechnianie wizerunku. Nagranie na własny użytek to co innego niż udostępnianie.",32],["Media piszą o rekordzie świata w streamie charytatywnym dla Cancer Fighters. Czego materiał nie znalazł?",["Jakichkolwiek danych o kwocie zebranej przez fundację","Potwierdzenia od Guinness World Records","Informacji o tym, kto zorganizował akcję"],1,"Autorzy nie znaleźli potwierdzenia rekordu od Guinness World Records, a kwoty podają z datą stanu, bo liczby rosły.",33],["Zanim wpłacisz na zbiórkę w sieci, co według materiału warto sprawdzić?",["Czy do końca akcji zostało niewiele czasu","Ile osób polubiło i udostępniło wpis ze zbiórką","Kto zbiera pieniądze i jak rozlicza wydatki"],2,"Warto sprawdzić, kto zbiera pieniądze, czy jest oficjalna strona zbiórki i jak rozliczane są wydatki.",33],["Komentator namawia do szybkiej wpłaty na prywatne konto, bo „czas goni”. Co jest tu sygnałem fałszywej zbiórki?",["Nazwa fundacji i sprawozdania na jej oficjalnej stronie","Udział znanych osób w promowaniu zbiórki w mediach","Prywatne konto, presja czasu i brak organizacji"],2,"Prywatne konto, presja czasu i brak organizacji to typowe oznaki fałszywej zbiórki. Wpłacaj przez oficjalne strony fundacji lub zweryfikowane serwisy.",33]]},{"nr":22,"modul":5,"etykieta":"Gdzie szukać pomocy","rodzaj":"zwykle","pyt":[["Podałeś dane do logowania lub wykonałeś przelew oszustowi. Od czego zacząć?",["Zadzwonić do banku, potem na policję","Poczekać kilka dni, czy pieniądze wrócą same","Zapłacić zaliczkę firmie odzyskującej pieniądze"],0,"Przy oszustwach finansowych najpierw dzwonisz do banku, potem zgłaszasz sprawę na policję. Zaliczka dla firm odzyskujących pieniądze to druga fala oszustwa.",34],["Jaki numer wybrać w bezpośrednim zagrożeniu życia?",["Numer 116 123, bo działa całą dobę","Numer 112, a nie infolinię emocjonalną","Numer 8080, bo służy do zgłoszeń awaryjnych"],1,"W bezpośrednim zagrożeniu życia dzwoni się pod 112. Numer 116 123 to wsparcie emocjonalne, a 8080 służy do przekazywania podejrzanych SMS-ów.",34],["Komentator radzi nie zgłaszać oszustwa, bo pieniędzy i tak się nie odzyska. Co jest błędne?",["Szybkie zgłoszenie pozwala bankowi zablokować środki","Zgłoszenie ma sens wyłącznie przy stracie dużej kwoty","Zgłoszenie jest ważne, ale tylko po tygodniu od zdarzenia"],0,"Zgłoszenie jest ważne nawet wtedy, gdy odzyskanie pieniędzy jest trudne: sprawa trafia do rejestru, a bank może zablokować środki, jeśli zareagujesz szybko.",34],["Na czym polega mechanizm zarobku na „AI slop” według materiału?",["Tania produkcja i wypłaty za wyświetlenia","Platforma płaci twórcom za jakość i ręczną weryfikację","Odbiorcy płacą abonament za dostęp do tanich treści"],0,"Wygenerowanie treści kosztuje grosze, a platforma płaci za wyświetlenia. Koszt sprawdzenia treści nie spadł, więc rośnie ilość niezweryfikowanego materiału.",35],["Shumailov i in. opisali „zapaść modeli”. Co pokazali później Gerstgrasser i in.?",["Zapaść dotyczy tylko modeli obrazowych, nie tekstowych","Zapaść występuje także wtedy, gdy dokłada się nowe dane","Gdy nowe dane dokłada się do starych, zapaści nie ma"],2,"Gerstgrasser i in. pokazali, że przy dokładaniu nowych danych do starych do zapaści nie dochodzi, więc spór dotyczy założeń eksperymentu.",35]]},{"nr":23,"modul":5,"etykieta":"AI slop","rodzaj":"zwykle","pyt":[["Komentator publikuje tekst wygenerowany przez AI bez czytania. Co jest w tym błędne?",["Za treść odpowiada wyłącznie twórca narzędzia AI","Błędem jest samo użycie AI, nawet gdy tekst się poprawi","Tekst może zawierać zmyślenia, a odpowiada autor"],2,"Niesprawdzony tekst może zawierać zmyślenia, a odpowiada za niego osoba, która go publikuje. Przeczytaj, popraw i oznacz użycie AI.",35],["Dlaczego wskazówki typu „sprawdź palce i odbicia” nie są trwałą metodą rozpoznawania zdjęć AI?",["Takie wady występują na każdym prawdziwym zdjęciu","Generatory poprawiają właśnie te błędy","Wskazówki działają tylko na zdjęcia czarno-białe"],1,"Kolejne wersje generatorów poprawiają dokładnie te elementy, więc wskazówka szybko się starzeje. Brak wad nie dowodzi, że zdjęcie jest prawdziwe.",36],["W internetowym quizie Microsoftu ponad 12 tys. osób oceniło ok. 287 tys. obrazów. Jaka była trafność ocen?",["Ok. 95%, obrazy rozpoznawano prawie bezbłędnie","Ok. 62%, niewiele lepiej niż rzut monetą","Ok. 80%, wyraźnie lepiej niż przypadek u większości osób"],1,"Trafność wyniosła 62%, czyli niewiele ponad rzut monetą. Własne wrażenie, że coś „widać”, nie jest dobrym miernikiem trafności.",36],["Widzisz reklamę, w której znana osoba obiecuje wysoki zysk z inwestycji. Co robić?",["Uznać za wiarygodną, bo platforma sprawdza każdą reklamę","Kliknąć link z reklamy i przeczytać warunki na stronie","Traktować jak oszustwo do czasu sprawdzenia w źródłach"],2,"Platformy nie sprawdzają każdej reklamy z góry, a oszuści kupują ją jak każdy inny. Znana osoba polecająca inwestycję to typowy wzór oszustwa, więc sprawdź ją na stronach instytucji lub fact-checkerów.",36]]},{"nr":24,"modul":6,"etykieta":"Deepfake","rodzaj":"zwykle","pyt":[["Ktoś rozsyła wygenerowany nagi wizerunek osoby bez jej zgody. Jak według materiału wygląda sytuacja prawna w Polsce?",["Obowiązuje osobny przepis, a kara sięga 5 lat więzienia","Brak osobnego przepisu, działają przepisy ogólne","Prawo nie daje żadnych narzędzi, bo obraz jest sztuczny"],1,"Poselski projekt nie został uchwalony, więc osobnej kary nadal nie ma. Do tego czasu stosuje się przepisy ogólne i ochronę dóbr osobistych.",37],["Jesteś ofiarą deepfake. Jak postąpić z dowodami?",["Negocjować ze sprawcą w prywatnej wiadomości usunięcie","Odesłać materiał znajomym, by potwierdzili, że to fałsz","Zrobić zrzuty z adresem i datą, nie przesyłać dalej"],2,"Zabezpiecz zrzuty ekranu z adresem i datą, ale nie przesyłaj treści dalej. Sprawcy nie odpowiadaj i nie negocjuj, a sprawę zgłoś platformie i na policję.",37],["Komentator: „Seksualny deepfake znajomego to tylko żart, nikt nie ucierpi”. Co jest w tym błędne?",["Błędne jest tylko to, że nie oznaczono go jako żartu","Uderza w godność i poczucie bezpieczeństwa","Żart jest błędem tylko wtedy, gdy znajomy to zobaczy"],1,"Żart i krzywda to dwie różne rzeczy: seksualizowany wizerunek bez zgody uderza w godność i reputację. Nie ma „żartu”, gdy osoba nie wyraziła zgody.",37],["W badaniu Fitzpatrick i in. (2017) 70 osób przez dwa tygodnie używało bota terapeutycznego. Jaki był wynik i zastrzeżenie?",["Objawy depresji wzrosły, bo rozmowy z botem były zbyt krótkie","Bot zastąpił terapeutę także w kryzysie, co potwierdzono","Mniej objawów depresji, lecz badanie było krótkie"],2,"Bot zmniejszył objawy depresji bardziej niż materiał informacyjny, ale badanie było krótkie i nieoślepione. Nie pozwala to wnioskować o skuteczności w realnym kryzysie.",38],["Jaki sygnał powinien skłonić Cię do kontaktu z człowiekiem zamiast z chatbotem?",["Wolisz bota od ludzi albo rozmowa nasila lęk","Bot zbyt często proponuje zmianę tematu lub przerwę w rozmowie","Bot nie pamięta szczegółów poprzednich rozmów i często się myli"],0,"Gdy bot zaczyna zastępować ludzi albo rozmowa nasila lęk, skontaktuj się z bliskim lub psychologiem. W kryzysie dzwoń na 116 123 lub 112.",38]]},{"nr":25,"modul":6,"etykieta":"Chatbot jako przyjaciel","rodzaj":"pulapka","cofnij":3,"pyt":[["Komentator: „Bot nie ocenia i nic nie ryzykuję, więc to idealna relacja”. Co to pomija?",["Pomija, że bot potrafi prowadzić tylko krótkie rozmowy","Pomija, że rozmowy z botem są wolniejsze niż z człowiekiem","Relacja bez ryzyka nie uczy radzenia sobie z konfliktem"],2,"Relacja bez ryzyka nie uczy radzenia sobie z odmową, konfliktem i cudzą perspektywą. Wiele aplikacji jest też zaprojektowanych tak, by utrzymać Cię w rozmowie.",38],["Prawnicy w Nowym Jorku (2023) przedstawili sądowi wyroki podane przez ChatGPT. Co się okazało?",["Wyroki zmyślono, a prawnicy dostali grzywnę 5 tys. dolarów","Wyroki były autentyczne, lecz sąd uznał je za nieaktualne","Wyroki były prawdziwe, ale prawnicy podali je w złej wersji"],0,"Wyroki wymyślił ChatGPT, a prawnicy dostali grzywnę 5 tys. dolarów. Dlatego każdy fakt i cytat z AI trzeba sprawdzać w oryginale.",39],["Detektor AI pokazuje, że praca jest „sztuczna”. Jak to oceniać według badania Weber-Wulff i in. (2023)?",["Wynik jest wiarygodny, jeśli praca była krótka lub obcojęzyczna","Narzędzia są zawodne, sam wynik nie wystarcza do zarzutu","Detektory są niemal bezbłędne, więc wynik jest rozstrzygający"],1,"Badacze uznali dostępne narzędzia za niedokładne i zawodne, a proste zabiegi maskujące pogarszały ich wyniki. Oskarżenie na podstawie samego wyniku może uderzyć w uczciwą osobę.",39],["Student: „AI to jak kalkulator, więc nie muszę niczego zgłaszać”. Co w tym błędne?",["Błędne jest tylko to, że kalkulator nie jest narzędziem AI","Wymóg zgłaszania dotyczy wyłącznie prac wykonanych w grupie","Tam, gdzie regulamin wymaga, trzeba podać użycie AI"],2,"Porównanie jest tylko częściowe: tekst wygenerowany i oddany jako własny może naruszać zasady uczelni, jeśli wymagają ujawnienia. Sprawdź regulamin i tam, gdzie trzeba, podaj użycie AI.",39],["Co stało się latem 2025 r. z rozmowami udostępnionymi przez opcję „widoczne dla wyszukiwarek”?",["Zostały automatycznie usunięte po tygodniu od udostępnienia","Wyciekły po ataku hakerów na serwery producenta","Trafiły do wyszukiwarki, a producent wycofał funkcję"],2,"Rozmowy zostały zaindeksowane przez wyszukiwarkę, a producent wycofał funkcję pod koniec lipca 2025 r. To nie był atak hakerski: wspólny link to publikacja, a nie prywatna wiadomość.",40]]},{"nr":26,"modul":6,"etykieta":"Co wklejasz do chatbota","rodzaj":"zwykle","pyt":[["Notatki z praktyk zawierają imię klienta, nazwę firmy i kwoty. Jak je przygotować do wklejenia do chatbota?",["Zmienić nazwę firmy na inną i zostawić kwoty bez zmian","Usunąć imię klienta, bo reszta danych nie wskazuje osoby","Usunąć wszystko, co identyfikuje, lub zapytać opiekuna"],2,"Sama zmiana imienia nie jest anonimizacją, bo nazwa firmy, kwoty i kontekst mogą wskazać klienta. Anonimizuj wszystko albo zapytaj opiekuna, czy w ogóle można tych danych użyć.",40],["Komentator uważa, że modele niczego nie zapamiętują. Co pokazało badanie Carlini i in. (2021) na modelu GPT-2?",["Dane wydobyto dopiero po zhakowaniu serwera producenta","Model odtwarzał wyłącznie ogólne streszczenia danych","Wydobyto dosłowne fragmenty danych treningowych"],2,"Z modelu GPT-2 wydobyto dosłowne fragmenty danych treningowych, w tym dane osobowe. Ryzyko zależy od modelu i sposobu użycia, ale założenie „nie pamięta” jest zbyt pewne.",40],["Czym według Wineburga i McGrew (2019) fact-checkerzy różnili się od historyków przy ocenie stron?",["Czytali stronę dłużej i dokładniej od początku do końca","Opuszczali stronę i sprawdzali ją w innych źródłach","Opierali się głównie na wyglądzie strony i liczbie polubień"],1,"Fact-checkerzy oceniali strony trafniej i szybciej, bo opuszczali stronę i sprawdzali ją gdzie indziej (czytanie boczne). Próba była jednak niewielka.",41],["Podczas powodzi w 2024 r. krążyły wygenerowane przez AI obrazy dziewczynki. Jaki prosty sygnał ostrzegawczy to pokazało?",["Ta sama „tragedia” w wielu miejscowościach naraz","Wszystkie posty były podpisane tym samym nazwiskiem autora","Obrazy miały zbyt wysoką rozdzielczość jak na powódź"],0,"Obrazy pojawiały się także w miejscach, których powódź nie dotknęła. Ten sygnał można sprawdzić bez żadnego narzędzia.",41],["Komentator: „Wszyscy to udostępniają, więc musi być prawdziwe”. Co jest w tym błędne?",["Nic, bo duża liczba udostępnień oznacza, że ktoś to sprawdził","Zasięg rośnie od emocji i powtórzeń, nie od prawdziwości","Błędne jest tylko to, że udostępnienia liczy się zbyt krótko"],1,"Szerzej rozchodzą się treści budzące silne emocje, a powtórzenie samo podnosi wiarygodność twierdzenia (efekt iluzji prawdy). Liczba udostępnień nie jest dowodem.",41]]},{"nr":27,"modul":6,"etykieta":"„Ja tylko wpłaciłem”","rodzaj":"zwykle","pyt":[["Co według Kutza (2000) wystarcza do moralnego współudziału w zbiorowej krzywdzie, nawet gdy wpłata nie jest konieczna?",["Wkład musi być konieczny dla powodzenia przedsięwzięcia","Świadome dołączenie do wspólnego celu","Wystarczy samo oglądanie, bez świadomości skutków"],1,"Według Kutza współudział nie wymaga, by Twój wkład był konieczny; liczy się świadome dołączenie do wspólnego przedsięwzięcia. Tysiąc małych wpłat to razem duża zachęta do eskalacji.",42],["Czy polski przepis obowiązujący od 23.08.2026 wprost wskazuje widza wpłacającego jako sprawcę?",["Tak, ale tylko wtedy, gdy wpłata przekroczy ustalony próg kwoty","Nie, odpowiada nadawca; sprawa widza jest otwarta","Tak, widz odpowiada na równi z nadawcą, jeśli wpłacił pieniądze"],1,"Przepis karze nadawcę działającego dla zysku, nawet za zgodą poniżanego, ale nie nazywa sprawcą widza. Jego odpowiedzialność z ogólnych zasad (np. pomocnictwo) pozostaje pytaniem otwartym.",42],["Podczas transmisji widzisz, że ktoś może być w niebezpieczeństwie. Co robić?",["Napisać na czacie prośbę do nadawcy o przerwanie transmisji","Zgłosić samemu, nie czekać na tłum; w nagłej sytuacji 112","Poczekać, aż zgłosi ktoś inny, bo wielu widzów już to widzi"],1,"Im więcej osób jest obecnych, tym wolniej reaguje każda z nich (efekt świadka). Zgłoś sam, jako konkretna osoba, a w nagłej sytuacji zadzwoń pod 112.",42],["Pracownik w Hongkongu wykonał 15 przelewów (ok. 200 mln HKD) po wideokonferencji z „dyrektorem”. Co ustaliła policja?",["Wszyscy pozostali uczestnicy byli sfałszowani","Sfałszowany był tylko dyrektor finansowy, reszta prawdziwa","Uczestnicy byli prawdziwi, a fałszywe były tylko rachunki"],0,"Według policji wszyscy pozostali uczestnicy wideokonferencji byli sfałszowani. Wideo i głos przestały być dowodem tożsamości.",43],["Dzwoni „szef” z pilną, poufną prośbą o przelew. Co robić?",["Ocenić po głosie i tonie, czy rozmówca brzmi wiarygodnie","Poprosić szefa o numer i oddzwonić właśnie tam","Rozłączyć się i oddzwonić na numer znaleziony samemu"],2,"Przy nietypowej prośbie o pieniądze rozłącz się i oddzwoń na numer, który sam znajdziesz. Znajomość głosu nie jest uwierzytelnieniem.",43]]},{"nr":28,"modul":6,"etykieta":"Głos szefa","rodzaj":"premia","doprzodu":3,"pyt":[["Komentator: „Pracownik sam sobie winien, powinien rozpoznać fałszywe twarze”. Co jest w tym błędne?",["Oszustwo rozwiewa wątpliwości; obroną są procedury","Błędne jest tylko to, że pracownik nie zgłosił sprawy szybciej","Nic, bo wystarczy uważnie przyjrzeć się twarzom na wideo"],0,"Oszustwo zaprojektowano tak, by rozwiać wątpliwość, na przykład kilkoma znanymi twarzami. Obwinianie jednej osoby niczego nie zabezpiecza, skuteczne są procedury.",43],["Co radził dokument RFC 1855 z 1995 roku w sprawie pisania wielkimi literami?",["Pisać nimi całe wiadomości, by odbiorca nie przeoczył treści","Nie pisać samymi wielkimi, bo odbiera się to jak krzyk","Używać ich w tytułach, by wyróżnić pilne sprawy w skrzynce"],1,"Dokument radził nie pisać samymi wielkimi literami, bo w tekście brak tonu głosu i odbiera się to jak krzyk. Do podkreślenia wystarczy jedno słowo wielkimi literami albo pogrubienie.",44],["Co pokazały eksperymenty Krugera i in. (2005) o piszących e-maile i odbiorze ich tonu?",["Trafnie przewidywali odbiór tonu, zwłaszcza w tekście pisanym","Przeceniali, jak trafnie odbiorca odczyta ich intencję","Niedoceniali, jak trafnie odbiorca odczyta ich intencję"],1,"Piszący byli przekonani, że adresat odczyta ton zgodnie z intencją, a trafność odczytu była niższa niż ta pewność. Przy głosie rozbieżność była mniejsza.",44],["Komentator: „Kropka w krótkiej odpowiedzi SMS to reguła języka i oznacza złość”. Co w tym błędne?",["Kropka wpływa na odbiór tylko w odręcznych notatkach","Błędne jest tylko to, że w SMS-ach używa się kropek","To zwyczaj części grup, nie reguła języka"],2,"W eksperymentach krótkie odpowiedzi z kropką bywały oceniane jako chłodniejsze, ale to zwyczaj części grup, a w odręcznych notatkach efektu nie było. Warto zapytać, jak ktoś to odbiera.",44],["Często powtarzane „do 40 procent czasu” traconego na przełączanie zadań: co ta liczba oznacza według kursu?",["Średnią stratę każdego pracownika wykonującego pracę biurową","Stały odsetek czasu tracony przy każdym rodzaju zadania","Górne oszacowanie dla złożonych, częstych przełączeń"],2,"Liczba pochodzi od Meyera, cytowanego przez APA, i opisuje górną granicę dla złożonych, częstych przełączeń, a nie średnią.",45]]},{"nr":29,"modul":7,"etykieta":"Wielozadaniowość to mit","rodzaj":"zwykle","pyt":[["Komentator pisze: „Robię kilka rzeczy naraz i czuję, że świetnie mi idzie”. Co w tym rozumowaniu jest błędne?",["Poczucie płynności nie mierzy kosztu przełączania","Do pracy naraz nadają się wyłącznie zadania ręczne i proste","Płynność pracy zależy tylko od liczby otwartych okien i kart"],0,"Koszty przełączania mierzy się w ułamkach sekundy i w błędach, których zwykle się nie zauważa, więc samo poczucie niczego nie dowodzi.",45],["Chcesz ograniczyć koszt przełączania zadań w pracy. Co według kursu warto zrobić?",["Odpowiadać na wiadomości od razu, żeby nic nie zalegało w skrzynce","Blok czasu na jedno zadanie i poczta o ustalonych porach","Robić kilka zadań naraz, żeby szybciej skończyć pracę"],1,"Kurs zaleca blok czasu na jedno zadanie, wyciszone powiadomienia i sprawdzanie poczty o ustalonych porach.",45],["Co wykazała ankieta CareerBuilder i Harris Poll z 2018 roku wśród zatrudniających w USA?",["70% sprawdzało kandydatów w mediach społecznościowych","Niewielu pracodawców sprawdzało kandydatów w internecie","Pracodawcy sprawdzali tylko profile zawodowe kandydatów"],0,"Według ankiety 70% pracodawców sprawdzało kandydatów w mediach społecznościowych, a 57% z nich znalazło treści, przez które zrezygnowało z kandydata.",46],["Komentator: „Zawyżenie kwalifikacji w profilu to zwykłe zarządzanie wrażeniem, jak u Goffmana”. Co jest tu błędne?",["Dobór prawdziwych treści to nie to samo co zmyślanie","Goffman pisał wyłącznie o rozmowach kwalifikacyjnych w firmach","Zarządzanie wrażeniem jest dozwolone tylko poza internetem"],0,"Goffman opisywał odgrywanie ról, ale różnica leży między doborem prawdziwych treści a ich wymyślaniem, które jest wprowadzaniem w błąd.",46],["Jak według kursu w jeden wieczór sprawdzić swój wizerunek w sieci?",["Usunąć wszystkie profile, żeby nie zostawiać żadnego śladu","Dodać do znajomych jak najwięcej osób z całej branży","Wyszukać siebie w oknie incognito, także w Grafice"],2,"Kurs radzi wpisać imię i nazwisko w wyszukiwarkę w oknie incognito, obejrzeć zakładkę Grafika i uzupełnić jeden profil zawodowy.",46]]},{"nr":30,"modul":7,"etykieta":"Sławni z bycia sławnymi","rodzaj":"zwykle","pyt":[["Co pokazała analiza losowej próby kanałów YouTube (Bärtl 2018) o rozkładzie wyświetleń?",["Wyświetlenia rozkładają się mniej więcej równo między kanały","Większość wyświetleń trafia do połowy najlepszych kanałów","Średnio 85% wyświetleń trafia do 3% kanałów"],2,"Analiza wykazała skrajną nierówność: średnio 85% wyświetleń przypada na 3% kanałów.",47],["Komentator: „Influencer to nowy zawód, więc zarobi na nim każdy, kto zacznie”. Co w tym jest błędne?",["Praca twórców jest zbyt prosta, by dawała stały dochód","Dochody są bardzo nierówne, a widać głównie sukcesy","Tylko platformy decydują, kto może zacząć tworzyć treści"],1,"Dochody twórców są nierówne i trudne do przewidzenia, a to, co widać, to wybór sukcesów (błąd ocalałego).",47],["Chcesz ocenić rekomendację influencera. Co według kursu warto sprawdzić?",["Liczbę obserwujących i częstotliwość publikowania treści","Oznaczenie reklamy i niezależne potwierdzenie opinii","Jakość montażu i liczbę polubień pod każdym wpisem"],1,"Kurs radzi sprawdzić, czy współpraca jest oznaczona jako reklama, czy ktoś niezależny potwierdza opinię i czy rekomendacja nie służy interesowi twórcy.",47],["Czym według kursu jest internetowy ruch pro-ana?",["Terapią grupową prowadzoną przez specjalistów w sieci","Ruchem przedstawiającym jadłowstręt jako styl życia","Zbiorem porad na temat zdrowego i bezpiecznego odchudzania"],1,"Pro-ana przedstawia jadłowstręt psychiczny jako styl życia, a nie chorobę, choć WHO opisuje go jako chorobę z poważnymi powikłaniami.",48]]},{"nr":31,"modul":7,"etykieta":"Pro-ana i „motylki”","rodzaj":"pulapka","cofnij":3,"pyt":[["Komentator: „To tylko dieta, samo przejdzie”. Co jest błędne w takim podejściu do zaburzeń odżywiania?",["Zaburzenie mija, gdy rodzina kontroluje wszystkie posiłki","Zaburzenia odżywiania występują wyłącznie u nastolatek","To choroba, przy której czekanie bywa ryzykowne"],2,"Dieta i zaburzenie odżywiania to nie to samo, a WHO wiąże jadłowstręt z przedwczesną śmiercią z powodu powikłań lub samobójstwa.",48],["Bliska osoba unika wspólnych obiadów i martwisz się o nią. Co według kursu zrobić?",["Postawić ultimatum przy wspólnych posiłkach w domu","Opisać, co widzisz, i zaproponować wizytę u lekarza","Skomentować jej wagę, żeby zrozumiała powagę problemu"],1,"Kurs radzi nie komentować ciała, tylko opisać obserwacje, powiedzieć, że jesteś obok, i zaproponować wizytę u lekarza rodzinnego lub psychiatry.",48],["Co pokazali Wolfsfeld, Segev i Sheafer (2013) o mediach społecznościowych w państwach arabskich?",["Ich użycie nie miało związku z liczbą protestów w regionie","Ich użycie częściej było skutkiem protestów niż przyczyną","Ich użycie zawsze poprzedzało protesty i je wywoływało"],1,"Na danych z 20 państw arabskich wzrost używania mediów społecznościowych częściej następował po protestach, więc badacze spierają się, ile robi sama sieć.",49],["Komentator: „Klikam udostępnij pod apelem i już pomagam”. Co według kursu warto do tego dodać?",["Gest warto uzupełnić wpłatą, podpisem lub wolontariatem","Udostępnienie jest równie wartościowe jak wpłata na zbiórkę","Udostępniać warto wyłącznie apele znajomych i rodziny"],0,"Większość członków kampanii „Save Darfur” na Facebooku nie zwerbowała innych ani nie wpłaciła pieniędzy; gest nie jest zły, ale warto dodać czyn.",49],["Dostajesz poruszające nagranie z prośbą o udostępnienie. Co według kursu sprawdzić najpierw?",["Kto je opublikował i czy potwierdzają je niezależne źródła","Czy autor wskazuje winnego z imienia i nazwiska w opisie","Ile osób już je udostępniło i skomentowało w ciągu ostatniej doby"],0,"Zasięg mierzy emocje, a nie prawdziwość, dlatego trzeba sprawdzić autora, datę i niezależne potwierdzenie; nie wolno też wskazywać w sieci winnej osoby.",49]]},{"nr":32,"modul":7,"etykieta":"Dark net","rodzaj":"zwykle","pyt":[["Czym według kursu różni się głęboka sieć (deep web) od ciemnej sieci (dark net)?",["To dwie nazwy tej samej, w całości nielegalnej części sieci","Deep web to strony, które znajduje zwykła wyszukiwarka","Deep web to zasoby za hasłem, dark net to osobna część"],2,"Głęboka sieć to głównie zwykłe zasoby za logowaniem, a ciemna sieć wymaga specjalnego oprogramowania anonimizującego, np. Tora.",50],["Komentator: „Dark net to 95% internetu, same przestępstwa”. Co w tym jest błędne?",["Zlewa deep web z małą częścią, jaką tworzą ukryte usługi","Przestępstwa popełnia się wyłącznie w zwykłym internecie","Tor jest narzędziem przeznaczonym wyłącznie dla zawodowych hakerów"],0,"Nie znaleziono źródła dla liczby 95%, a ruch do ukrytych usług w sieci Tor to według Tor Metrics rząd kilku procent.",50],["Ktoś bliski opowiada o „zabójcach do wynajęcia” w dark necie. Co według kursu zrobić?",["Zapytać, skąd to wie, i razem sprawdzić, co jest legendą","Wyśmiać opowieść i szybko zakończyć rozmowę na ten temat","Zakazać mu korzystania z internetu do końca tego tygodnia"],0,"Kurs radzi spokojnie zapytać o źródło i razem oddzielić legendy od faktów, bo takie „usługi” to według analiz głównie oszustwa.",50],["Czym jest „exit scam” na rynkach dark netu?",["Przejęciem całego rynku przez specjalną jednostkę policji","Ucieczką administratorów z pieniędzmi z depozytów","Zamknięciem rynku na wspólną prośbę wszystkich sprzedawców"],1,"W exit scam administratorzy znikają z pieniędzmi z depozytów, jak przy rynku Evolution w 2015 roku.",51],["Komentator: „Płacę kryptowalutą, więc nikt mnie nie wyśledzi”. Co w tym jest błędne?",["Śledzone są tylko płatności powyżej określonej kwoty","Rejestr bywa publiczny, a ślad prowadzi do giełdy","Służby nie mają uprawnień do działania poza własnym krajem"],1,"Wiele kryptowalut działa na publicznym rejestrze transakcji, a wymiana na giełdzie z identyfikacją klienta zostawia dane.",51]]},{"nr":33,"modul":7,"etykieta":"Czarne rynki dark netu","rodzaj":"zwykle","pyt":[["Ktoś bliski kupił coś na czarnym rynku i boi się konsekwencji. Co kurs radzi zrobić najpierw?",["Szybko zgłosić go na policję, zanim zrobi to ktoś inny","Zadbać o jego zdrowie, potem poszukać pomocy prawnej","Usunąć wszelkie ślady zamówienia z jego urządzeń i konta"],1,"Najpierw liczy się zdrowie (112 w nagłym wypadku), a potem rozmowa z prawnikiem lub poradnią uzależnień.",51],["Gdzie według Dyżurnet.pl za 2025 r. znajdowała się większość potwierdzonych incydentów z materiałami wykorzystywania dzieci?",["Wyłącznie w zamkniętych grupach i na prywatnych serwerach","W zwykłym internecie, hostingach i komunikatorach","W sieci Tor i innych ukrytych usługach internetowych"],1,"Tylko ok. 2% potwierdzonych incydentów było w sieci Tor, więc główne ryzyko nie ogranicza się do dark netu.",52],["Komentator: „Tylko popatrzę na takie treści z udziałem dziecka, to nie przestępstwo”. Co jest błędne?",["Karalne jest tylko rozpowszechnianie takich treści dalej w sieci","Karalne jest też uzyskiwanie dostępu, nie tylko posiadanie","Karalne jest wyłącznie posiadanie plików na własnym dysku twardym"],1,"Prawo karze także uzyskiwanie dostępu do takich treści, a za materiałem stoi krzywda realnego dziecka.",52],["Natrafiasz w sieci na nielegalne treści z udziałem dziecka. Co według kursu zrobić?",["Zapisać zrzut ekranu i wysłać go znajomym, by ostrzec","Zignorować je, bo zgłoszenia i tak nic nie zmieniają","Nie zapisywać ich, a adres zgłosić do Dyżurnet.pl"],2,"Nie wolno pobierać, zapisywać ani przesyłać takich treści dalej; adres zgłasza się do Dyżurnet.pl, a przy zagrożeniu dzwoni się na 112.",52],["Jak według kursu kończyły się największe upadki w świecie kryptowalut, np. giełdy FTX?",["Były skutkiem zwykłych błędów w technologii blockchain i kodzie","Wynikały głównie z zakazów nałożonych przez państwa na rynek","W dużej mierze były to oszustwa, nie zwykłe ryzyko rynku"],2,"Założyciel FTX został skazany za oszustwa, podobnie jak szefowie Terra/Luna i Celsius.",53]]},{"nr":34,"modul":8,"etykieta":"Kryptowaluty","rodzaj":"zwykle","pyt":[["Komentator: „Stablecoin ma stały kurs, więc jest w pełni bezpieczny”. Co w tym jest błędne?",["Stały kurs gwarantuje państwo, lecz tylko w UE","Stały kurs to cel, a ryzykiem jest emitent","Stablecoiny są bezpieczne tylko przy małych kwotach"],1,"TerraUSD upadł w 2022 roku, a USDC spadł w 2023 roku do ok. 0,87 dolara, gdy ujawniono problem z rezerwami emitenta.",53],["Jak według kursu traktować kryptowaluty w swoim budżecie?",["Jako bezpieczną lokatę na przyszłość rodziny","Jako ryzykowny dodatek, nie oszczędności","Jako główny sposób oszczędzania na emeryturę"],1,"Kurs radzi inwestować tylko tyle, ile można stracić bez wpływu na codzienne rachunki.",53],["Dlaczego model językowy potrafi podać zmyśloną informację pewnym tonem?",["Przewiduje kolejne słowa, a nie sprawdza faktów","Przy każdej odpowiedzi zagląda do bazy, ale często ją myli","Celowo wprowadza w błąd, by użytkownik dłużej rozmawiał"],0,"Model uczy się przewidywać, jakie słowo padnie dalej, i nie zagląda do bazy faktów, a trening częściej nagradza zgadywanie niż „nie wiem”.",54],["Po odpowiedzi czatu z cytatami pytasz go: „Czy jesteś pewien?”. Czy potwierdzenie rozstrzyga sprawę?",["Tak, bo model sprawdza wtedy dane w bazie","Tak, bo model przyznaje się do błędu, gdy ma wątpliwości","Nie, bo potwierdzenie bywa równie zmyślone"],2,"Pytanie „czy jesteś pewien?” nie uruchamia sprawdzania w bazie, a model generuje kolejną prawdopodobną odpowiedź, więc weryfikacją jest dopiero znalezienie źródła poza czatem.",54],["Czat podaje link jako źródło swojej informacji. Co zrobić, zanim jej użyjesz?",["Sprawdzić, czy adres wygląda poprawnie i prowadzi do znanej strony","Uznać informację za pewną, skoro model podał adres źródła","Otworzyć go i znaleźć w tekście zdanie, na które się powołuje"],2,"Link w odpowiedzi nie dowodzi, że strona mówi to, co streszcza model, a jeśli zdania w tekście nie ma, nie należy używać tej informacji.",54]]},{"nr":35,"modul":8,"etykieta":"Czaty AI","rodzaj":"zwykle","pyt":[["Co zwykle daje płatny plan czatu AI w porównaniu z wersją darmową?",["Gwarancję, że rozmowy nie posłużą do trenowania modeli","Mocniejszy model, wyższe limity i dodatkowe funkcje","Odpowiedzi zweryfikowane w bazach faktów, a więc bez błędów"],1,"Płatny plan daje zwykle mocniejszy model, wyższe limity i dodatkowe funkcje, a nie „inną prawdę”, więc fakty trzeba sprawdzać niezależnie od planu.",55],["Zastanawiasz się nad płatnym planem czatu AI. Co warto zrobić najpierw?",["Wybrać czat z pierwszego miejsca w rankingu użytkowników","Wykupić najdroższy plan, bo ma najwięcej funkcji i limitów","Przez tydzień testować darmową wersję na swoich zadaniach"],2,"Test darmowej wersji na prawdziwych zadaniach pokazuje, czy w ogóle trafiasz na limity, a ranking głosów mierzy preferencje, nie przydatność w Twojej pracy.",55],["Ktoś mówi: „Płacę za plan, więc moje rozmowy na pewno nie służą do trenowania”. Co jest błędne?",["Nic, bo płatny plan zawsze wyłącza trenowanie na rozmowach","Płatne plany indywidualne też bywają domyślnie trenowane","Trenowanie dotyczy tylko rozmów z kont firmowych dostawcy"],1,"Zapłata sama nie zmienia zasad trenowania: w planach indywidualnych bywa ono domyślnie włączone albo zależy od Twojej zgody, a domyślny brak trenowania deklarują dostawcy dla planów firmowych.",55],["Zdjęcie leży w sieci bez zabezpieczeń. Czy możesz je przenieść na swoją stronę, jeśli podasz źródło?",["Tak, ale tylko do celów niekomercyjnych, np. do referatu","Tak, wystarczy podać stronę, z której pobrano zdjęcie","Nie, ponowna publikacja wymaga zgody autora"],2,"W sprawie „Cordoba” TSUE uznał, że publikacja na nowej stronie wymaga nowej zgody, nawet gdy oryginał był dostępny bez zabezpieczeń, a pod kopią podano źródło.",56],["Znalazłeś swoje zdjęcie na cudzej stronie. Co zrobić, zanim napiszesz do sprawcy?",["Opublikować wpis z nazwiskiem sprawcy, aby wywrzeć presję","Zapisać dowody: zrzuty ekranu z datą i archiwum strony","Od razu napisać do sprawcy z żądaniem natychmiastowego usunięcia"],1,"Najpierw zabezpiecza się dowody: zrzuty ekranu z adresem i datą, kopię w publicznym archiwum i oryginał w pełnej rozdzielczości, a publiczne oskarżenie bez dowodów grozi sprawą o zniesławienie.",56]]},{"nr":36,"modul":8,"etykieta":"Ktoś ukradł Twoje zdjęcie","rodzaj":"premia","doprzodu":3,"pyt":[["Firma usunęła Twoje zdjęcie po wezwaniu i uważa sprawę za zamkniętą. Co jest błędne w tym myśleniu?",["Usunięcie nie kasuje roszczeń za czas, gdy zdjęcie wisiało","Nic, po usunięciu zdjęcia autor traci prawo do odszkodowania","Usunięcie jest skuteczne tylko, gdy autor zarejestrował zdjęcie"],0,"Usunięcie zatrzymuje dalsze naruszenie, ale nie kasuje roszczeń za wcześniejszy okres, jak w sprawie zdjęcia tulipanów, gdzie sąd zasądził zapłatę mimo usunięcia.",56],["Pracujesz na etacie i tworzysz projekt w ramach swoich obowiązków. Co z prawami autorskimi?",["Majątkowe ma pracodawca, a autorstwo zostaje przy Tobie","Wszystkie prawa zostają przy Tobie, dopóki nie podpiszesz cesji","Wszystkie prawa, także do autorstwa, przechodzą na pracodawcę"],0,"Prawa majątkowe przechodzą na pracodawcę z chwilą przyjęcia pracy, w granicach celu umowy, chyba że umowa stanowi inaczej, a prawa osobiste, np. autorstwo, zostają przy twórcy.",57],["Zaczynasz zlecenie dla klienta jako freelancer. Co sprawdzić w umowie w sprawie praw autorskich?",["Czy klient ma siedzibę w Polsce i jakie są terminy płatności","Czy prawa się przenosi, czy licencjonuje, i na jakich polach","Czy umowa została zawarta w formie elektronicznej lub ustnej"],1,"Przy umowach cywilnych nie ma automatu: liczy się, czy prawa są przenoszone czy licencjonowane, na jakich polach eksploatacji i od kiedy.",57],["Klient mówi: „Zapłaciłem za projekt, więc prawa autorskie są moje”. Co jest błędne?",["Przeniesienie wymaga pisemnej umowy z polami eksploatacji","Prawa przechodzą na klienta dopiero po publikacji projektu","Klient nabywa prawa, ale tylko do użytku wewnętrznego firmy"],0,"Zapłata za projekt nie przenosi praw: przeniesienie praw majątkowych wymaga formy pisemnej i wymienienia pól eksploatacji, a bez tego przyjmuje się licencję.",57]]},{"nr":37,"modul":8,"etykieta":"Piractwo","rodzaj":"zwykle","pyt":[["Co TSUE uznał w sprawie Mircom (2021) o programie do torrentów, który w trakcie pobierania wysyła innym kawałki pliku?",["Zwykłe pobieranie na własny użytek, które jest zawsze dozwolone","Publiczne udostępnianie, gdy program zainstalowano świadomie","Czynność neutralną, jeśli ograniczysz prędkość wysyłania"],1,"Wysyłanie nawet samych fragmentów pliku to według TSUE publiczne udostępnianie, jeśli użytkownik świadomie zainstalował taki program, a ograniczenie prędkości nie zmienia charakteru czynności.",58],["Dostajesz wezwanie do zapłaty 750 zł za rzekome udostępnianie filmu przez torrent. Co zrobić?",["Odpisać nadawcy i przyznać się, by uniknąć sprawy w sądzie","Sprawdzić nadawcę i pokazać pismo prawnikowi przed zapłatą","Zapłacić w terminie, bo wezwanie oznacza prawdziwe roszczenie"],1,"Nie płaci się pod presją terminu: trzeba sprawdzić, kto pisze, w czyim imieniu i na jakich dowodach, bo bywały masowe pisma straszące bez podstaw, choć prawdziwe roszczenia też się zdarzają.",58],["Ktoś twierdzi: „Samo oglądanie pirackiego strumienia to nie przestępstwo, więc nie ma skutków prawnych”. Co to pomija?",["Że oglądanie jest karane tak samo jak sprzedaż pirackich dekoderów","Wyjątek dla kopii tymczasowych nie chroni świadomego oglądania","Nic, sprawa dotyczy wyłącznie osób, które udostępniają pliki innym"],1,"W Polsce nie ma przepisu karnego za samo oglądanie, ale TSUE uznał w 2017 r., że kopie tymczasowe przy świadomym oglądaniu nielegalnego strumienia nie korzystają z wyjątku, a za używanie pirackiego dekodera grozi grzywna.",58],["Co o grafice wygenerowanej wyłącznie na podstawie polecenia (promptu) uznał Urząd Praw Autorskich USA w 2025 r.?",["Zwykle nie jest utworem, bo polecenie to za mało","Jest utworem, ale prawa należą do dostawcy narzędzia","Jest utworem chronionym, a prawa ma autor polecenia"],0,"Same polecenia, nawet pomysłowe, działają jak instrukcja przekazująca idee, a ten sam prompt daje różne wyniki, więc wyłączności może nie być.",59],["Chcesz sprzedać grafikę wygenerowaną przez AI. Co warto zrobić wcześniej?",["Poprosić narzędzie o potwierdzenie, że wynik nie narusza praw","Sprawdzić regulamin i podobieństwo do cudzych postaci","Dopisać znaczek © i uznać, że zapewnia wyłączność"],1,"Regulamin daje prawo korzystania, ale nie gwarantuje wyłączności ani tego, że wynik nie narusza cudzych praw, a za publikację odpowiada ten, kto sprzedaje.",59]]},{"nr":38,"modul":8,"etykieta":"AI a prawo autorskie","rodzaj":"pulapka","cofnij":4,"pyt":[["Ktoś twierdzi: „Obraz w stylu Ghibli z generatora zawsze narusza prawa autorskie”. Co jest uproszczeniem?",["Nic, styl jest chroniony tak samo jak konkretne dzieło","Styl zwykle nie jest chroniony, ale konkretne dzieła tak","Chronione są tylko postacie, a nie sceny ani kadry z filmów"],1,"Prawo autorskie chroni konkretny sposób wyrażenia, a nie styl, więc naruszeniem może być kopia lub przeróbka konkretnej ilustracji albo postaci, ale nie sam klimat.",59],["Jaka część ładowań stron w Chrome idzie według Google przez szyfrowane HTTPS, co zmniejsza ryzyko publicznego Wi-Fi?",["Niewielka mniejszość, głównie strony instytucji publicznych","Zdecydowana większość, ok. 95–99%","Mniej więcej połowa, głównie strony banków i sklepów"],1,"Według Google ok. 95–99% ładowań stron idzie przez HTTPS, więc właściciel sieci nie czyta haseł ani przelewów, a realne ryzyko leży w fałszywych sieciach i stronach logowania.",60],["Musisz załatwić ważną sprawę, a masz tylko nieznaną sieć Wi-Fi. Co poleca się zrobić?",["Połączyć się z siecią o najsilniejszym sygnale","Zalogować się kontem e-mail, by dostać darmowy dostęp","Użyć hotspotu z telefonu zamiast nieznanej sieci"],2,"Przy ważnych sprawach lepszy jest hotspot z telefonu, a logowanie kontem e-mail do „darmowego Wi-Fi” może oddać dane napastnikowi prowadzącemu fałszywą sieć.",60],["Reklama obiecuje: „VPN chroni Cię przed hakerami w publicznym Wi-Fi”. Czego VPN nie robi?",["Nie szyfruje połączenia między telefonem a serwerem VPN","Nie ukrywa odwiedzanych witryn przed operatorem sieci","Nie sprawdza, czy strona logowania jest prawdziwa"],2,"VPN szyfruje ruch do serwera dostawcy, ale nie sprawdza prawdziwości stron, nie powstrzyma phishingu ani złośliwej aplikacji, a zaufanie przenosi się na dostawcę VPN.",60],["Dlaczego włączony drugi składnik logowania nie chroni przed programem kradnącym ciasteczko sesji?",["Ciasteczko działa jak przepustka bez hasła i bez kodu","Program przechwytuje też kod w chwili jego wpisywania","Drugi składnik działa tylko w usługach bankowych"],0,"Serwis uznaje wtedy przestępcę za zalogowanego Ciebie, bez hasła i kodu, ale drugi składnik nadal jest potrzebny, bo chroni przed skradzionym samym hasłem.",61]]},{"nr":39,"modul":9,"etykieta":"Złośliwe programy","rodzaj":"zwykle","pyt":[["Chcesz zainstalować nowy program. Skąd bezpieczniej go pobrać?",["Z linku od „sponsora” w mailu, jeśli wygląda profesjonalnie","Z pierwszej reklamy w wyszukiwarce z nazwą programu","Ze strony producenta wpisanej ręcznie albo ze sklepu"],2,"Reklamy w wyszukiwarce potrafią podszywać się pod strony producentów, a pliki od „sponsora” z maila były drogą infekcji, więc adres producenta wpisuje się ręcznie.",61],["Ktoś radzi: „Zapłać okup za odszyfrowanie danych, to je odzyskasz”. Co jest błędne w tej radzie?",["Zapłata zwykle kończy sprawę, bo klucz jest zawsze wysyłany","Okup obniża koszt odzyskania danych, ale wydłuża proces","Nie ma gwarancji odzyskania ani nieujawnienia danych"],2,"Zapłata nie daje pewności ani odzyskania danych, ani tego, że nie zostaną ujawnione, więc instytucje radzą ogólnie nie płacić, zgłosić atak i sprawdzić, czy istnieje darmowy dekryptor.",61],["Jak działa model „ransomware jako usługa”, w którym działają gangi?",["Haker sam atakuje i sprzedaje klientom tylko skradzione dane","Państwo zleca prywatnym grupom ataki w zamian za immunitet","Twórcy dają kod, podwykonawcy atakują, a okup się dzieli"],2,"W tym modelu twórcy udostępniają oprogramowanie szyfrujące, „podwykonawcy” atakują, a okup się dzieli, więc gangi działają jak firmy.",62],["Znalazłeś w sieci panel bez hasła z cudzymi danymi. Jak należy postąpić?",["Nie otwierać danych, zgłosić lukę właścicielowi lub CSIRT","Napisać o luce publicznie, aby właściciel szybciej zareagował","Zajrzeć do danych dla pewności, a potem zgłosić lukę"],0,"Nie sprawdza się luki „dla pewności” i nie otwiera cudzych danych, tylko zapisuje tyle, ile trzeba do opisu, i zgłasza ją właścicielowi albo przez formularz CSIRT NASK, także anonimowo.",62],["Nastolatek mówi: „Tylko sprawdziłem, ile widać, i nic nie zniszczyłem, więc to nie przestępstwo”. Co jest błędne?",["Nic, bez szkody dostęp do cudzego systemu nie jest karalny","Odpowiadają tylko osoby pełnoletnie, nieletnich się nie karze","Samo uzyskanie dostępu bez uprawnienia jest karalne"],2,"Kodeks karny karze już samo uzyskanie dostępu do systemu bez uprawnienia, do 2 lat, także gdy nic nie zniszczono, a nieletnimi zajmuje się zwykle sąd rodzinny.",62]]}],"teksty":{"widok":{"zapas":"Gra „Finał kursu: Plansza HoldUp” — plansza z pytaniami z całego kursu. Jeśli się nie wczyta (na przykład w aplikacji mobilnej Moodle), otwórz tę stronę w przeglądarce internetowej albo skorzystaj z listy pytań pod grą.","zasady_tytul":"Zasady gry","stan_tytul":"Stan gry","stan_ty":"Ty: pole {pole} — {etykieta}","stan_komputer":"Komputer: pole {pole} — {etykieta}","stan_wynik":"Twoje dobre odpowiedzi: {dobre} z {zadane}","pionek_ty_znak":"Ty","pionek_komputer_znak":"K","rzuc":"Rzuć kostką","kostka_pusta":"–","kostka_slownie":"jeden|dwa|trzy|cztery|pięć|sześć","slowo_pole":"pole|pola|pól","tura_gracza":"Twoja tura. Naciśnij „Rzuć kostką”.","tura_komputera":"Tura komputera.","komputer_rzuca":"Komputer rzuca…","wyrzucil_ty":"Wyrzuciłeś/aś {liczba} ({slownie}).","wyrzucil_komputer":"Komputer wyrzucił {liczba} ({slownie}).","ruch_ty":"Twój pionek na polu {pole}: {etykieta}{rodzaj}.","ruch_komputer":"Pionek komput
